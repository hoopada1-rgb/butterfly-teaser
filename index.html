<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Teaser</title>
  <style>
    /* Reset & Center Container */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d0d; /* Dark background */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Play/Pause Button Style */
    .play-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 30px rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      background-color: #f0f0f0;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    /* SVG Icon Styles */
    .icon {
      fill: #0d0d0d;
      width: 40px;
      height: 40px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- The Play Button -->
  <button class="play-btn" id="toggleBtn" aria-label="Play Track">
    <!-- Play Icon -->
    <svg id="playIcon" class="icon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <!-- Pause Icon -->
    <svg id="pauseIcon" class="icon hidden" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  </button>

  <!-- Audio Element (Replace 'song.mp3' with your audio file or audio URL) -->
  <audio id="audioTrack" src="https://files.catbox.moe/dam18e.wav" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audioTrack');
    const toggleBtn = document.getElementById('toggleBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    toggleBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        audio.pause();
        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');
      }
    });

    // Reset icon when song ends
    audio.addEventListener('ended', () => {
      pauseIcon.classList.add('hidden');
      playIcon.classList.remove('hidden');
    });
  </script>
</body>
</html>
